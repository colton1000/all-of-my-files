<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cursor Studio - Draw and Export CUR Files</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--panel:#161b22;--panel2:#21262d;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--danger:#f85149}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
button,input,select{font:inherit}.app{max-width:1420px;margin:auto;padding:16px}.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.topbar h1{font-size:22px;margin:0;margin-right:auto}.status{color:var(--muted)}
.layout{display:grid;grid-template-columns:245px minmax(420px,1fr) 280px;gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}.panel h2{font-size:14px;margin:0 0 10px;color:#c9d1d9}.roles{display:grid;gap:6px;max-height:650px;overflow:auto}.role{display:grid;grid-template-columns:42px 1fr 25px;align-items:center;gap:8px;width:100%;padding:7px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--text);text-align:left;cursor:pointer}.role:hover{background:var(--panel2)}.role.active{border-color:var(--accent);background:#1f3044}.role canvas{width:40px;height:40px;image-rendering:pixelated;background-image:linear-gradient(45deg,#fff 25%,transparent 25%),linear-gradient(-45deg,#fff 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#fff 75%),linear-gradient(-45deg,transparent 75%,#fff 75%);background-size:10px 10px;background-position:0 0,0 5px,5px -5px,-5px 0;background-color:#bbb;border-radius:4px}.dirty{color:#f2cc60;text-align:center}
.workspace{display:flex;flex-direction:column;align-items:center;min-width:0}.toolbar{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:10px}.tool,.action{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:7px 10px;border-radius:6px;cursor:pointer}.tool:hover,.action:hover{border-color:#6e7681}.tool.active{background:#1f6feb;border-color:#58a6ff}.action.primary{background:#238636;border-color:#2ea043}.action.danger{color:#ff7b72}.sep{width:1px;height:28px;background:var(--line);margin:0 3px}
.canvasWrap{position:relative;max-width:100%;overflow:auto;border:1px solid var(--line);background:#080b10;padding:10px;border-radius:8px}#editor{display:block;cursor:crosshair;touch-action:none;image-rendering:pixelated;background:#fff}.canvasInfo{display:flex;gap:16px;justify-content:center;color:var(--muted);margin-top:8px}.hint{color:var(--muted);font-size:12px;text-align:center;margin-top:8px}
.control{margin-bottom:14px}.control label{display:block;color:#c9d1d9;margin-bottom:5px}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.field{width:100%;border:1px solid var(--line);background:#0d1117;color:var(--text);border-radius:6px;padding:7px}.small{width:68px}.wheelWrap{position:relative;width:210px;height:210px;margin:auto}#wheel{width:210px;height:210px;cursor:crosshair;border-radius:50%}.colorPreview{width:38px;height:38px;border:2px solid #fff;border-radius:7px;background:#000}.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:8px}.swatch{aspect-ratio:1;border:1px solid #6e7681;border-radius:4px;cursor:pointer}.previewBox{display:flex;align-items:center;justify-content:center;min-height:100px;border:1px solid var(--line);border-radius:7px;background:#f0f0f0}.previewBox canvas{width:64px;height:64px;image-rendering:pixelated}.kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px}
.toast{position:fixed;right:18px;bottom:18px;background:#238636;color:white;padding:10px 14px;border-radius:7px;box-shadow:0 5px 25px #0008;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}
@media(max-width:980px){.layout{grid-template-columns:190px 1fr}.settings{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(210px,1fr));gap:14px}.settings h2{grid-column:1/-1}.wheelWrap{margin:0 auto}}@media(max-width:700px){.layout{display:block}.panel{margin-bottom:12px}.roles{grid-template-columns:repeat(2,1fr);max-height:none}.settings{display:block}#editor{width:384px!important;height:384px!important}}
</style>
</head>
<body><div class="app">
<div class="topbar"><h1>Cursor Studio</h1><span class="status">Standalone pixel cursor editor</span><button class="action" id="newProject">Reset All</button><button class="action primary" id="zipAll">Download All as ZIP</button></div>
<div class="layout">
<aside class="panel"><h2>Cursor roles</h2><div class="roles" id="roles"></div></aside>
<main class="panel workspace">
<div class="toolbar">
<button class="tool active" data-tool="pencil" title="Pencil (P)">✏ Pencil</button><button class="tool" data-tool="eraser" title="Eraser (E)">⌫ Eraser</button><button class="tool" data-tool="fill" title="Fill (F)">▣ Fill</button><button class="tool" data-tool="picker" title="Eyedropper (I)">◉ Pick</button><span class="sep"></span><button class="action" id="undo">↶ Undo</button><button class="action" id="redo">↷ Redo</button><button class="action danger" id="clear">Clear</button>
</div>
<div class="canvasWrap"><canvas id="editor" width="512" height="512" aria-label="Cursor pixel drawing canvas"></canvas></div>
<div class="canvasInfo"><span id="coord">Pixel: 0, 0</span><span id="roleLabel">Normal Select</span></div>
<div class="hint">Left-drag to draw. Right-drag to erase. Set the hotspot by entering coordinates on the right.</div>
</main>
<aside class="panel settings"><h2>Color and export</h2>
<div class="control"><div class="wheelWrap"><canvas id="wheel" width="210" height="210" aria-label="Color wheel"></canvas></div><div class="row" style="margin-top:9px"><div class="colorPreview" id="colorPreview"></div><input class="field" id="colorText" value="#000000" aria-label="Hex color"><input type="color" id="nativeColor" value="#000000" title="System color picker"></div><div class="swatches" id="swatches"></div></div>
<div class="control"><label>Cursor size</label><select class="field" id="cursorSize"><option value="16">16 × 16</option><option value="24">24 × 24</option><option value="32" selected>32 × 32</option><option value="48">48 × 48</option><option value="64">64 × 64</option></select></div>
<div class="control"><label>Hotspot (active click point)</label><div class="row"><label>X <input class="field small" id="hotX" type="number" min="0" max="31" value="0"></label><label>Y <input class="field small" id="hotY" type="number" min="0" max="31" value="0"></label></div></div>
<div class="control"><label>Live preview</label><div class="previewBox"><canvas id="preview" width="64" height="64"></canvas></div></div>
<div class="row"><button class="action" id="downloadCur" style="flex:1">Download .cur</button><button class="action" id="copyRole" title="Copy this drawing">Copy</button><button class="action" id="pasteRole" title="Paste copied drawing">Paste</button></div>
<p class="hint"><span class="kbd">Ctrl+Z</span> undo · <span class="kbd">P</span> pencil · <span class="kbd">E</span> eraser · <span class="kbd">F</span> fill</p>
</aside></div></div><div class="toast" id="toast"></div>
<script>
'use strict';
const CURSOR_ROLES=[['normal-select','Normal Select',0,0],['help-select','Help Select',0,0],['working-background','Working in Background',0,0],['busy','Busy',16,16],['precision-select','Precision Select',16,16],['text-select','Text Select',16,16],['handwriting','Handwriting',0,31],['unavailable','Unavailable',16,16],['vertical-resize','Vertical Resize',16,16],['horizontal-resize','Horizontal Resize',16,16],['diagonal-resize-1','Diagonal Resize 1',16,16],['diagonal-resize-2','Diagonal Resize 2',16,16],['move','Move',16,16],['alternate-select','Alternate Select',0,31],['link-select','Link Select',5,0],['location-select','Location Select',16,31],['person-select','Person Select',16,16]];
let size=32, currentRole=0, tool='pencil', color='#000000', drawing=false, lastCell=null, clipboard=null;
const projects=new Map();
function blankProject(n=32,hx=0,hy=0){return {size:n,pixels:new Uint8ClampedArray(n*n*4),hotX:Math.min(hx,n-1),hotY:Math.min(hy,n-1),undo:[],redo:[],dirty:false}}
CURSOR_ROLES.forEach((r,i)=>projects.set(i,blankProject(32,r[2],r[3])));
const $=s=>document.querySelector(s), editor=$('#editor'), ctx=editor.getContext('2d',{alpha:false}), preview=$('#preview'), pctx=preview.getContext('2d'), rolesEl=$('#roles');
function checker(c,w,h,cell){c.fillStyle='#ddd';c.fillRect(0,0,w,h);c.fillStyle='#fff';for(let y=0;y<h;y+=cell)for(let x=0;x<w;x+=cell)if(((x/cell+y/cell)&1)===0)c.fillRect(x,y,cell,cell)}
function renderRoles(){rolesEl.innerHTML='';CURSOR_ROLES.forEach((r,i)=>{const b=document.createElement('button');b.className='role'+(i===currentRole?' active':'');b.innerHTML=`<canvas width="40" height="40"></canvas><span>${r[1]}</span><span class="dirty">${projects.get(i).dirty?'●':''}</span>`;b.onclick=()=>switchRole(i);rolesEl.appendChild(b);renderMini(b.querySelector('canvas'),projects.get(i));});}
function renderMini(can,p){const c=can.getContext('2d');checker(c,40,40,5);const im=new ImageData(p.pixels,p.size,p.size),tmp=document.createElement('canvas');tmp.width=tmp.height=p.size;tmp.getContext('2d').putImageData(im,0,0);c.imageSmoothingEnabled=false;c.drawImage(tmp,0,0,40,40)}
function current(){return projects.get(currentRole)}
function switchRole(i){currentRole=i;size=current().size;$('#cursorSize').value=size;$('#hotX').value=current().hotX;$('#hotY').value=current().hotY;updateHotLimits();$('#roleLabel').textContent=CURSOR_ROLES[i][1];renderAll()}
function renderEditor(){const p=current(),scale=editor.width/p.size;checker(ctx,editor.width,editor.height,scale);const im=new ImageData(p.pixels,p.size,p.size),tmp=document.createElement('canvas');tmp.width=tmp.height=p.size;tmp.getContext('2d').putImageData(im,0,0);ctx.imageSmoothingEnabled=false;ctx.drawImage(tmp,0,0,editor.width,editor.height);ctx.strokeStyle='rgba(90,90,90,.25)';ctx.lineWidth=1;ctx.beginPath();for(let i=1;i<p.size;i++){let v=Math.round(i*scale)+.5;ctx.moveTo(v,0);ctx.lineTo(v,editor.height);ctx.moveTo(0,v);ctx.lineTo(editor.width,v)}ctx.stroke();let hx=(p.hotX+.5)*scale,hy=(p.hotY+.5)*scale;ctx.strokeStyle='#ff2b2b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(hx-6,hy);ctx.lineTo(hx+6,hy);ctx.moveTo(hx,hy-6);ctx.lineTo(hx,hy+6);ctx.stroke()}
function renderPreview(){const p=current();checker(pctx,64,64,8);const im=new ImageData(p.pixels,p.size,p.size),tmp=document.createElement('canvas');tmp.width=tmp.height=p.size;tmp.getContext('2d').putImageData(im,0,0);pctx.imageSmoothingEnabled=false;pctx.drawImage(tmp,0,0,64,64)}
function renderAll(){renderEditor();renderPreview();renderRoles();$('#undo').disabled=!current().undo.length;$('#redo').disabled=!current().redo.length}
function snapshot(){const p=current();p.undo.push(p.pixels.slice());if(p.undo.length>60)p.undo.shift();p.redo.length=0}
function mark(){current().dirty=true;renderAll()}
function rgba(hex){const n=parseInt(hex.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255,255]}
function indexAt(x,y,p=current()){return (y*p.size+x)*4}
function setPixel(x,y,col){const p=current();if(x<0||y<0||x>=p.size||y>=p.size)return;const k=indexAt(x,y,p);p.pixels.set(col,k)}
function cellFromEvent(e){const r=editor.getBoundingClientRect(),p=current();return {x:Math.max(0,Math.min(p.size-1,Math.floor((e.clientX-r.left)/r.width*p.size))),y:Math.max(0,Math.min(p.size-1,Math.floor((e.clientY-r.top)/r.height*p.size)))}}
function line(a,b,col){let x0=a.x,y0=a.y,x1=b.x,y1=b.y,dx=Math.abs(x1-x0),sx=x0<x1?1:-1,dy=-Math.abs(y1-y0),sy=y0<y1?1:-1,err=dx+dy;while(true){setPixel(x0,y0,col);if(x0===x1&&y0===y1)break;let e2=2*err;if(e2>=dy){err+=dy;x0+=sx}if(e2<=dx){err+=dx;y0+=sy}}}
function flood(x,y,newCol){const p=current(),start=indexAt(x,y,p),old=Array.from(p.pixels.slice(start,start+4));if(old.every((v,i)=>v===newCol[i]))return;const stack=[[x,y]],seen=new Uint8Array(p.size*p.size);while(stack.length){const [cx,cy]=stack.pop(),si=cy*p.size+cx;if(seen[si])continue;seen[si]=1;const k=si*4;if(!old.every((v,i)=>p.pixels[k+i]===v))continue;p.pixels.set(newCol,k);if(cx)stack.push([cx-1,cy]);if(cx<p.size-1)stack.push([cx+1,cy]);if(cy)stack.push([cx,cy-1]);if(cy<p.size-1)stack.push([cx,cy+1])}}
function begin(e){e.preventDefault();drawing=true;editor.setPointerCapture(e.pointerId);lastCell=cellFromEvent(e);snapshot();const effective=e.button===2?'eraser':tool;if(effective==='fill'){flood(lastCell.x,lastCell.y,rgba(color));drawing=false;mark()}else if(effective==='picker'){pick(lastCell);drawing=false}else{line(lastCell,lastCell,effective==='eraser'?[0,0,0,0]:rgba(color));renderEditor();renderPreview()}}
function move(e){const c=cellFromEvent(e);$('#coord').textContent=`Pixel: ${c.x}, ${c.y}`;if(!drawing)return;const effective=(e.buttons&2)?'eraser':tool;if(effective==='pencil'||effective==='eraser'){line(lastCell,c,effective==='eraser'?[0,0,0,0]:rgba(color));lastCell=c;renderEditor();renderPreview()}}
function end(){if(drawing){drawing=false;mark()}}
function pick(c){const p=current(),k=indexAt(c.x,c.y,p);if(!p.pixels[k+3])return;setColor('#'+[p.pixels[k],p.pixels[k+1],p.pixels[k+2]].map(v=>v.toString(16).padStart(2,'0')).join(''))}
editor.addEventListener('pointerdown',begin);editor.addEventListener('pointermove',move);editor.addEventListener('pointerup',end);editor.addEventListener('pointercancel',end);editor.addEventListener('contextmenu',e=>e.preventDefault());
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('active',x===b))});
function doUndo(){const p=current();if(!p.undo.length)return;p.redo.push(p.pixels.slice());p.pixels=p.undo.pop();p.dirty=true;renderAll()}function doRedo(){const p=current();if(!p.redo.length)return;p.undo.push(p.pixels.slice());p.pixels=p.redo.pop();p.dirty=true;renderAll()}
$('#undo').onclick=doUndo;$('#redo').onclick=doRedo;$('#clear').onclick=()=>{snapshot();current().pixels.fill(0);mark()};
function resizeProject(newSize){const old=current(),np=blankProject(newSize,Math.round(old.hotX*newSize/old.size),Math.round(old.hotY*newSize/old.size));for(let y=0;y<newSize;y++)for(let x=0;x<newSize;x++){const ox=Math.floor(x*old.size/newSize),oy=Math.floor(y*old.size/newSize);np.pixels.set(old.pixels.slice((oy*old.size+ox)*4,(oy*old.size+ox)*4+4),(y*newSize+x)*4)}np.dirty=true;projects.set(currentRole,np);size=newSize;updateHotLimits();$('#hotX').value=np.hotX;$('#hotY').value=np.hotY;renderAll()}
$('#cursorSize').onchange=e=>resizeProject(+e.target.value);function updateHotLimits(){$('#hotX').max=$('#hotY').max=current().size-1}
['hotX','hotY'].forEach(id=>$('#'+id).oninput=e=>{const p=current(),v=Math.max(0,Math.min(p.size-1,+e.target.value||0));p[id==='hotX'?'hotX':'hotY']=v;p.dirty=true;renderAll()});
// HSV color wheel
const wheel=$('#wheel'),wctx=wheel.getContext('2d'),W=210,C=W/2,R=C-2,wi=wctx.createImageData(W,W);for(let y=0;y<W;y++)for(let x=0;x<W;x++){let dx=x-C,dy=y-C,rad=Math.hypot(dx,dy),k=(y*W+x)*4;if(rad<=R){let h=(Math.atan2(dy,dx)*180/Math.PI+360)%360,s=rad/R,[r,g,b]=hsv(h,s,1);wi.data.set([r,g,b,255],k)}}wctx.putImageData(wi,0,0);
function hsv(h,s,v){let c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c,r=0,g=0,b=0;if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];return [r,g,b].map(q=>Math.round((q+m)*255))}
function setColor(v){if(!/^#[0-9a-f]{6}$/i.test(v))return;color=v.toUpperCase();$('#colorText').value=color;$('#nativeColor').value=color;$('#colorPreview').style.background=color}
function wheelPick(e){const r=wheel.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*W/r.height,dx=x-C,dy=y-C,rad=Math.min(R,Math.hypot(dx,dy)),h=(Math.atan2(dy,dx)*180/Math.PI+360)%360,[rr,g,b]=hsv(h,rad/R,1);setColor('#'+[rr,g,b].map(v=>v.toString(16).padStart(2,'0')).join(''))}
wheel.addEventListener('pointerdown',e=>{wheel.setPointerCapture(e.pointerId);wheelPick(e)});wheel.addEventListener('pointermove',e=>{if(e.buttons)wheelPick(e)});$('#nativeColor').oninput=e=>setColor(e.target.value);$('#colorText').onchange=e=>setColor(e.target.value);
const colors=['#000000','#FFFFFF','#808080','#C0C0C0','#FF0000','#FF8000','#FFFF00','#00FF00','#00FFFF','#0080FF','#0000FF','#8000FF','#FF00FF','#8B4513','#FFC0CB','#00A86B'];const sw=$('#swatches');colors.forEach(c=>{let b=document.createElement('button');b.className='swatch';b.style.background=c;b.title=c;b.onclick=()=>setColor(c);sw.appendChild(b)});
// CUR encoder: one uncompressed 32-bit DIB image plus 1-bit AND mask.
function curBytes(p){const n=p.size,rowMask=Math.ceil(n/32)*4,maskBytes=rowMask*n,pixelBytes=n*n*4,imageSize=40+pixelBytes+maskBytes,total=22+imageSize,ab=new ArrayBuffer(total),dv=new DataView(ab),u=new Uint8Array(ab);let o=0;dv.setUint16(o,0,true);o+=2;dv.setUint16(o,2,true);o+=2;dv.setUint16(o,1,true);o+=2;u[o++]=n===256?0:n;u[o++]=n===256?0:n;u[o++]=0;u[o++]=0;dv.setUint16(o,p.hotX,true);o+=2;dv.setUint16(o,p.hotY,true);o+=2;dv.setUint32(o,imageSize,true);o+=4;dv.setUint32(o,22,true);o+=4;dv.setUint32(o,40,true);o+=4;dv.setInt32(o,n,true);o+=4;dv.setInt32(o,n*2,true);o+=4;dv.setUint16(o,1,true);o+=2;dv.setUint16(o,32,true);o+=2;dv.setUint32(o,0,true);o+=4;dv.setUint32(o,pixelBytes,true);o+=4;dv.setInt32(o,0,true);o+=4;dv.setInt32(o,0,true);o+=4;dv.setUint32(o,0,true);o+=4;dv.setUint32(o,0,true);o+=4;for(let y=n-1;y>=0;y--)for(let x=0;x<n;x++){let k=(y*n+x)*4;u[o++]=p.pixels[k+2];u[o++]=p.pixels[k+1];u[o++]=p.pixels[k];u[o++]=p.pixels[k+3]}for(let y=n-1;y>=0;y--){let row=o;for(let x=0;x<n;x++){if(p.pixels[(y*n+x)*4+3]===0)u[row+(x>>3)]|=0x80>>(x&7)}o+=rowMask}return u}
function download(data,name,type='application/octet-stream'){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('#downloadCur').onclick=()=>{download(curBytes(current()),CURSOR_ROLES[currentRole][0]+'.cur','image/x-icon');toast('Cursor downloaded')};
// ZIP writer using STORE (no compression), UTF-8 names, CRC-32. No external library required.
const crcTable=(()=>{let t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();function crc32(a){let c=0xffffffff;for(const b of a)c=crcTable[(c^b)&255]^(c>>>8);return (c^0xffffffff)>>>0}
function zip(files){const enc=new TextEncoder(),parts=[],central=[];let offset=0;for(const f of files){const name=enc.encode(f.name),data=f.data,crc=crc32(data),lh=new Uint8Array(30+name.length),v=new DataView(lh.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x0800,true);v.setUint16(8,0,true);v.setUint32(14,crc,true);v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);v.setUint16(26,name.length,true);lh.set(name,30);parts.push(lh,data);const ch=new Uint8Array(46+name.length),cv=new DataView(ch.buffer);cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x0800,true);cv.setUint16(10,0,true);cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);cv.setUint16(28,name.length,true);cv.setUint32(42,offset,true);ch.set(name,46);central.push(ch);offset+=lh.length+data.length}const centralOffset=offset,centralSize=central.reduce((s,a)=>s+a.length,0),end=new Uint8Array(22),ev=new DataView(end.buffer);ev.setUint32(0,0x06054b50,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);ev.setUint32(12,centralSize,true);ev.setUint32(16,centralOffset,true);return new Blob([...parts,...central,end],{type:'application/zip'})}
$('#zipAll').onclick=()=>{const files=CURSOR_ROLES.map((r,i)=>({name:r[0]+'.cur',data:curBytes(projects.get(i))}));download(zip(files),'cursor-set.zip','application/zip');toast(`${files.length} cursor files downloaded`)};
$('#copyRole').onclick=()=>{const p=current();clipboard={size:p.size,pixels:p.pixels.slice(),hotX:p.hotX,hotY:p.hotY};toast('Drawing copied')};$('#pasteRole').onclick=()=>{if(!clipboard)return toast('Nothing copied yet');const p=current();p.undo.push(p.pixels.slice());p.size=clipboard.size;p.pixels=clipboard.pixels.slice();p.hotX=clipboard.hotX;p.hotY=clipboard.hotY;p.dirty=true;size=p.size;$('#cursorSize').value=size;$('#hotX').value=p.hotX;$('#hotY').value=p.hotY;updateHotLimits();renderAll();toast('Drawing pasted')};
$('#newProject').onclick=()=>{if(!confirm('Reset every cursor drawing?'))return;CURSOR_ROLES.forEach((r,i)=>projects.set(i,blankProject(32,r[2],r[3])));switchRole(0);toast('Project reset')};
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),1800)}
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?doRedo():doUndo()}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();doRedo()}else if(!/input|select/i.test(document.activeElement.tagName)){const map={p:'pencil',e:'eraser',f:'fill',i:'picker'};if(map[e.key.toLowerCase()])document.querySelector(`[data-tool="${map[e.key.toLowerCase()]}"]`).click()}});
setColor('#000000');renderAll();
</script></body></html>
