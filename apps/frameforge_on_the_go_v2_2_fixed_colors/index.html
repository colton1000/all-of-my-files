<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FrameForge: On the GO!</title><link rel="stylesheet" href="styles.css"></head>
<body><header><div><h1>FrameForge: On the GO!</h1><small id="status">Ready</small></div><div class="top"><select id="theme" aria-label="Theme"><option value="dark">Dark</option><option value="light">Light</option><option value="ocean">Ocean</option><option value="rose">Rose</option></select><button id="newProject">New</button></div></header>
<main><aside class="panel"><h2>Tools</h2><div class="tools"><button class="tool active" data-tool="pencil">Pencil</button><button class="tool" data-tool="marker">Marker</button><button class="tool" data-tool="eraser">Eraser</button><button id="fill">Fill</button></div><h2>Colors</h2><div class="defaultColors" id="defaultColors" aria-label="Default colors"><button class="colorSwatch" data-color="#000000" aria-label="Black" title="Black"></button><button class="colorSwatch active" data-color="#30104d" aria-label="Dark purple" title="Dark purple"></button><button class="colorSwatch" data-color="#ff9fcf" aria-label="Light pink" title="Light pink"></button><button class="colorSwatch" data-color="#8b1e2d" aria-label="Dark red" title="Dark red"></button><button class="colorSwatch" data-color="#143d73" aria-label="Dark blue" title="Dark blue"></button><button class="colorSwatch" data-color="#ffd633" aria-label="Yellow" title="Yellow"></button><button class="colorSwatch" data-color="#b84a0a" aria-label="Dark orange" title="Dark orange"></button><button class="colorSwatch" data-color="#168b87" aria-label="Teal" title="Teal"></button></div><label>Size <output id="sizeOut">8</output><input id="size" type="range" min="1" max="60" value="8"></label><label>Opacity <output id="opacityOut">100%</output><input id="opacity" type="range" min="5" max="100" value="100"></label><div class="two"><button id="undo">Undo</button><button id="redo">Redo</button></div><button id="clear" class="danger">Clear Frame</button><hr><h2>Project</h2><input id="projectName" maxlength="60" value="Untitled Animation" aria-label="Project name"><button id="save">Save Locally</button><button id="exportProject">Export Project</button><button id="importProject">Import Project</button><input id="importInput" type="file" accept="application/json,.json" hidden></aside>
<section class="center panel"><div class="canvasBar"><b>Canvas</b><span id="frameLabel">Frame 1 / 1</span></div><div class="canvasViewport"><div class="canvasStack"><canvas id="onion" width="640" height="480"></canvas><canvas id="canvas" width="640" height="480"></canvas></div></div><div class="playbar"><button id="prev">◀</button><button id="play">▶ Play</button><button id="stop">■</button><button id="next">▶</button><label>FPS <input id="fps" type="number" min="1" max="24" value="6"></label></div></section>
<aside class="panel"><h2>Frames</h2><div class="two"><button id="add">+ Blank</button><button id="duplicate">Duplicate</button></div><button id="deleteFrame" class="danger">Delete Frame</button><label class="check"><input id="onionToggle" type="checkbox" checked> Onion skin</label><div id="frames" class="frames"></div><p class="note">Projects save automatically. Popup content reloads safely each time it opens.</p></aside></main>
<script src="app.js"></script></body></html>
